services:
  app:
    build:
      dockerfile_inline: |
        FROM alpine:3.19
        RUN echo "dude" > /dude.txt
        CMD ["sleep", "infinity"]
    image: ${IMAGE:-${COMPOSE_PROJECT_NAME}-app}:${TAG:-latest}
    init: true
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1

  test:
    profiles: [test]
    command: "true"
    image: ${IMAGE:-${COMPOSE_PROJECT_NAME}-app}:${TAG:-latest}
    depends_on:
      app:
        condition: service_healthy
