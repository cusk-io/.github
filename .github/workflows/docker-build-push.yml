name: Docker Build, Test & Push

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
        description: "Full image name, e.g. ghcr.io/cusk-io/my-app"
      compose_file:
        required: false
        type: string
        default: "docker-compose.yml"
        description: "Path to the compose file defining build and test services"
      service_name:
        required: false
        type: string
        default: "app"
        description: "Name of the docker compose service to build and wait for (must have a healthcheck)"
    outputs:
      test_passed:
        value: ${{ jobs.test.outputs.test_passed }}

env:
  IMAGE: ${{ inputs.image_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.meta.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v6

      - name: Set metadata
        id: meta
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine cache tags
        id: cache-tags
        run: |
          CACHE_FROM="type=registry,ref=${{ env.IMAGE }}:latest"

          if [[ "${{ github.ref_type }}" == "branch" ]]; then
            BRANCH="${{ github.ref_name }}"
            CACHE_FROM="type=registry,ref=${{ env.IMAGE }}:branch-${BRANCH} ${CACHE_FROM}"
            CACHE_FROM="type=registry,ref=${{ env.IMAGE }}:buildcache-${BRANCH} ${CACHE_FROM}"
            CACHE_TO="type=registry,ref=${{ env.IMAGE }}:buildcache-${BRANCH},mode=max"
          else
            CACHE_TO=""
          fi

          echo "cache_from<<EOF" >> $GITHUB_OUTPUT
          echo "$CACHE_FROM" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "cache_to=$CACHE_TO" >> $GITHUB_OUTPUT

      - name: Build and push
        env:
          TAG: ${{ steps.meta.outputs.sha_tag }}
          CACHE_FROM: ${{ steps.cache-tags.outputs.cache_from }}
          CACHE_TO: ${{ steps.cache-tags.outputs.cache_to }}
        run: |
          set -e
          CACHE_FROM_SETS=""
          for src in $CACHE_FROM; do
            CACHE_FROM_SETS="$CACHE_FROM_SETS --set ${{ inputs.service_name }}.cache-from=$src"
          done
          docker buildx bake \
            --push \
            $CACHE_FROM_SETS \
            --set "${{ inputs.service_name }}.cache-to=${CACHE_TO}" \
            --set "${{ inputs.service_name }}.tags=${{ env.IMAGE }}:${TAG}" \
            --file "${{ inputs.compose_file }}" \
            "${{ inputs.service_name }}"

  test:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      IMAGE: ${{ inputs.image_name }}
      TAG: ${{ needs.build.outputs.sha_tag }}
    outputs:
      test_passed: ${{ steps.run_tests.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start services
        run: |
          docker compose -f "${{ inputs.compose_file }}" up -d --wait --no-build "${{ inputs.service_name }}"

      - name: Run tests
        id: run_tests
        run: docker compose -f "${{ inputs.compose_file }}" run --rm test

      - name: Stop services
        if: always()
        run: docker compose -f "${{ inputs.compose_file }}" down --volumes

  push-branch-tag:
    needs: [build, test]
    if: |
      needs.test.outputs.test_passed == 'true' &&
      github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and push branch tag
        env:
          SHA_TAG: ${{ needs.build.outputs.sha_tag }}
          BRANCH: ${{ github.ref_name }}
        run: |
          docker pull ${{ env.IMAGE }}:${SHA_TAG}
          docker tag ${{ env.IMAGE }}:${SHA_TAG} ${{ env.IMAGE }}:branch-${BRANCH}
          docker push ${{ env.IMAGE }}:branch-${BRANCH}
          if [[ "${BRANCH}" == "main" || "${BRANCH}" == "master" ]]; then
            docker tag ${{ env.IMAGE }}:${SHA_TAG} ${{ env.IMAGE }}:latest
            docker push ${{ env.IMAGE }}:latest
          fi

  push-version-tags:
    needs: [build, test]
    if: |
      needs.test.outputs.test_passed == 'true' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and tag version tags
        env:
          SHA_TAG: ${{ needs.build.outputs.sha_tag }}
        run: |
          docker pull ${{ env.IMAGE }}:${SHA_TAG}
          VERSION="${GITHUB_REF_NAME#v}"
          docker tag ${{ env.IMAGE }}:${SHA_TAG} ${{ env.IMAGE }}:${VERSION}
          docker push ${{ env.IMAGE }}:${VERSION}
          MINOR="${VERSION%.*}"
          docker tag ${{ env.IMAGE }}:${SHA_TAG} ${{ env.IMAGE }}:${MINOR}
          docker push ${{ env.IMAGE }}:${MINOR}
          MAJOR="${MINOR%.*}"
          docker tag ${{ env.IMAGE }}:${SHA_TAG} ${{ env.IMAGE }}:${MAJOR}
          docker push ${{ env.IMAGE }}:${MAJOR}
